name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: проверки (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Зависимости
        run: pip install -r requirements-dev.txt

      - name: Линтер
        run: ruff check .

      - name: Правила стиля
        run: python tools/style_check.py

      - name: Миграции и витрина
        run: |
          python -m scripts.migrate
          python -m scripts.build_dataset

      - name: Тесты
        run: python -m pytest -q

  docker:
    name: сборка образа
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Сборка
        run: docker build -t lada-cifra:ci .

      - name: Дымовой запуск
        run: |
          docker run -d --name lada-ci -p 8000:8000 lada-cifra:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ready > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/ready
          curl -fsS http://127.0.0.1:8000/health
          docker rm -f lada-ci
